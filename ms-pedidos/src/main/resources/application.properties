spring.application.name=ms-pedidos
server.port=8081

spring.datasource.url=jdbc:h2:mem:pedidosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.security.enabled=${SECURITY_ENABLED:true}

azure.tenant-id=${AZURE_TENANT_ID:}
azure.client-id=${AZURE_AUDIENCE:}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:pedidos}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pedidos123}
spring.rabbitmq.connection-timeout=5s

app.rabbit.exchanges.pedidos=pedidos.exchange
app.rabbit.routing-keys.pedido-creado=pedido.creado
app.rabbit.routing-keys.pedido-pagado=pedido.pagado
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=20000
spring.kafka.producer.properties.max.block.ms=5000

app.kafka.topics.eventos=pedidos-eventos
app.kafka.topics.analitica=pedidos-analitica