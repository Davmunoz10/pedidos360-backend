spring.application.name=ms-pedidos
server.port=8081

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:pedidosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola H2 (solo para uso local)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Interruptor de seguridad JWT: por defecto ACTIVADO.
# Para trabajar local sin token, arranca con la variable SECURITY_ENABLED=false
app.security.enabled=${SECURITY_ENABLED:true}

# Se usan cuando app.security.enabled=true (se entregan como variables de entorno)
azure.tenant-id=${AZURE_TENANT_ID:}
azure.client-id=${AZURE_AUDIENCE:}

# RabbitMQ (solo desarrollo local; en la nube se entregan como variables de entorno)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:pedidos}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pedidos123}
spring.rabbitmq.connection-timeout=5s

# Nombres centralizados de exchange y routing keys
app.rabbit.exchanges.pedidos=pedidos.exchange
app.rabbit.routing-keys.pedido-creado=pedido.creado
app.rabbit.routing-keys.pedido-pagado=pedido.pagado
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}