server:
  port: 8083
spring:
  application:
    name: ms-tickets
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:pedidos}
    password: ${RABBITMQ_PASSWORD:pedidos123}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 1
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      properties:
        session.timeout.ms: 15000
        heartbeat.interval.ms: 5000
    listener:
      ack-mode: record
      concurrency: 3
app:
  security:
    audience: ${AZURE_AUDIENCE}
  rabbit:
    exchanges:
      pedidos: pedidos.exchange
      dlx: pedidos.dlx
    queues:
      tickets: tickets.queue
      documentos: documentos.queue
    dlqs:
      tickets: tickets.dlq
      documentos: documentos.dlq
    routing-keys:
      tickets: pedido.creado
      tickets-dlq: tickets.dlq
      documentos: pedido.pagado
      documentos-dlq: documentos.dlq
    retry:
      max-retries: 3
  kafka:
    topics:
      eventos: pedidos-eventos
      analitica: pedidos-analitica
    groups:
      tickets: tickets-group
      analitica: analitica-group
    retry:
      interval-ms: 1000
      max-retries: 3